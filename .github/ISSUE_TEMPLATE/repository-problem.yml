name: Repository problem
description: Report a reproducible problem with repository tooling, documentation, or automation.
title: "[Repository]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for repository infrastructure problems only. Do not create duplicate assessment challenges or disclose vulnerabilities, credentials, candidate data, or private reports.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Documentation
        - Local development setup
        - Public test harness
        - GitHub Actions
        - Repository metadata or templates
        - Other repository infrastructure
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Explain what happened and what you expected instead.
      placeholder: Provide a concise, evidence-based description.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the relevant command, workflow run, commit SHA, or document link.
      placeholder: |
        1. Start from...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node.js version, browser, or runner when relevant.
      placeholder: Windows 11, Node.js 22.12, Chrome 130
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add sanitized logs, screenshots, or links. Never include secrets or private assessment data.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is not a security vulnerability or a request for a new assessment challenge.
          required: true
